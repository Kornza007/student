<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบบันทึกการฝึกงาน</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <div class="login-card">
        <h2 style="text-align: center; margin-bottom: 25px;">
            <i class="bi bi-shield-lock-fill me-2"></i>เข้าสู่ระบบ
        </h2>
        <div id="error-msg" style="color: #d90429; background-color: #ffe5ec; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; display: none; font-size: 14px;"></div>
        
        <form id="loginForm">
            <div style="margin-bottom: 18px;">
                <label class="form-label"><i class="bi bi-person-circle me-1"></i> ชื่อผู้ใช้งาน (Username):</label>
                <input type="text" id="username" class="form-control-custom" required style="margin-top: 6px;" placeholder="กรอกชื่อผู้ใช้งาน">
            </div>
            <div style="margin-bottom: 25px;">
                <label class="form-label"><i class="bi bi-key-fill me-1"></i> รหัสผ่าน (Password):</label>
                <input type="password" id="password" class="form-control-custom" required style="margin-top: 6px;" placeholder="กรอกรหัสผ่าน">
            </div>
            <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            try {
                const response = await fetch('api.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = 'index.html';
                } else {
                    errorMsg.innerText = data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
